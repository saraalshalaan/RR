<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الروبوت المتتبّع</title>
<style>
  :root{
    --bg:#05070d;
    --planet-1:#3a6ea8;
    --planet-2:#8fb8e0;
    --bot-body:#14161c;
    --bot-edge:#2a2e3a;
    --eye:#5CE87A;
    --glow:#4d8ce0;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    overflow:hidden;
    font-family:'Segoe UI', Tahoma, sans-serif;
  }
  .stage{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  /* stars */
  .stars, .stars2{
    position:absolute; inset:0;
    background-repeat:repeat;
    opacity:.7;
    pointer-events:none;
  }
  .stars{
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 140px 90px, #fff, transparent),
      radial-gradient(1px 1px at 90px 160px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 250px 40px, #fff, transparent),
      radial-gradient(1px 1px at 320px 200px, #fff, transparent);
    background-size:360px 260px;
  }
  .stars2{
    background-image:
      radial-gradient(1px 1px at 60px 120px, #cdd9ff, transparent),
      radial-gradient(1px 1px at 200px 20px, #cdd9ff, transparent),
      radial-gradient(1.5px 1.5px at 300px 150px, #cdd9ff, transparent);
    background-size:420px 300px;
    animation: drift 60s linear infinite;
  }
  @keyframes drift{ from{background-position:0 0;} to{background-position:-500px 300px;} }

  /* planet glow behind robot */
  .planet{
    position:absolute;
    bottom:-42vw;
    left:50%;
    transform:translateX(-50%);
    width:110vw;
    max-width:1200px;
    aspect-ratio:1/1;
    border-radius:50%;
    background:
      radial-gradient(circle at 35% 25%, var(--planet-2), var(--planet-1) 45%, #0d1a2e 72%);
    box-shadow:0 -40px 120px rgba(90,150,230,.35);
    pointer-events:none;
  }

  .title{
    position:absolute;
    top:6%;
    width:100%;
    text-align:center;
    color:#e8ecf5;
    pointer-events:none;
  }
  .title h1{
    font-size:clamp(28px,5vw,54px);
    margin:0;
    font-weight:600;
    letter-spacing:.5px;
  }
  .title span{ color:#7db2ff; }
  .title p{
    margin:14px auto 0;
    max-width:520px;
    font-size:14px;
    line-height:1.9;
    color:#a9b3c9;
  }

  /* ROBOT */
  .robot{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:4vh;
    filter:drop-shadow(0 20px 40px rgba(0,0,0,.6));
  }

  .antennae{
    display:flex;
    justify-content:space-between;
    width:150px;
    margin-bottom:-8px;
  }
  .antenna{
    width:6px;
    height:34px;
    background:linear-gradient(#3a4050,#1b1e26);
    border-radius:3px;
    position:relative;
    transform-origin:bottom center;
  }
  .antenna::after{
    content:"";
    position:absolute;
    top:-8px; left:50%;
    transform:translateX(-50%);
    width:12px;height:12px;
    background:radial-gradient(circle at 35% 30%, #cfe8ff, var(--glow));
    border-radius:50%;
    box-shadow:0 0 10px var(--glow);
  }

  .head{
    width:230px;
    height:200px;
    background:linear-gradient(155deg,#20232c,#0f1116 70%);
    border:2px solid var(--bot-edge);
    border-radius:70px 70px 60px 60px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:
      inset 0 -10px 20px rgba(0,0,0,.5),
      inset 0 8px 14px rgba(255,255,255,.03),
      0 0 40px rgba(70,130,220,.15);
    transition:transform .12s ease-out;
  }

  /* side ear/speaker */
  .head::before, .head::after{
    content:"";
    position:absolute;
    top:50%;
    width:26px;height:70px;
    background:linear-gradient(#1c1f27,#0c0d11);
    border:2px solid var(--bot-edge);
    border-radius:16px;
    transform:translateY(-50%);
  }
  .head::before{ left:-14px; }
  .head::after{ right:-14px; }

  .screen{
    width:150px;
    height:110px;
    background:radial-gradient(circle at 50% 40%, #0c1420, #030507 80%);
    border-radius:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    box-shadow:inset 0 0 18px rgba(0,0,0,.9);
  }

  .eye{
    width:26px;
    height:26px;
    position:relative;
  }
  .eye svg{ width:100%; height:100%; display:block; }
  .eye path{
    stroke:var(--eye);
    stroke-width:6;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
    filter:drop-shadow(0 0 6px var(--eye));
    transition:transform .08s ease-out;
  }

  .body{
    width:190px;
    height:120px;
    margin-top:6px;
    background:linear-gradient(160deg,#1c1f28,#0d0f14 75%);
    border:2px solid var(--bot-edge);
    border-radius:40px 40px 55px 55px;
    box-shadow:inset 0 -10px 18px rgba(0,0,0,.5), inset 0 6px 10px rgba(255,255,255,.03);
  }

  .neck{
    width:60px;height:16px;
    background:#101218;
    border:2px solid var(--bot-edge);
    border-radius:8px;
    margin-top:-4px;
    z-index:1;
  }

  .hint{
    position:absolute;
    bottom:4%;
    width:100%;
    text-align:center;
    color:#5a6478;
    font-size:12px;
    letter-spacing:.5px;
    pointer-events:none;
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="planet"></div>

  <div class="title">
    <h1>Our <span>Services</span>.</h1>
    <p>روبوتنا الصغير يراقب كل حركة تسويها بالماوس — حرّك المؤشر وشوف!</p>
  </div>

  <div class="robot" id="robot">
    <div class="antennae">
      <div class="antenna" id="antL"></div>
      <div class="antenna" id="antR"></div>
    </div>
    <div class="head" id="head">
      <div class="screen">
        <div class="eye">
          <svg viewBox="0 0 26 26"><path id="eyeL" d="M4 10 L4 4 L10 4"/></svg>
        </div>
        <div class="eye">
          <svg viewBox="0 0 26 26"><path id="eyeR" d="M4 10 L4 4 L10 4"/></svg>
        </div>
      </div>
    </div>
    <div class="neck"></div>
    <div class="body"></div>
  </div>

  <div class="hint">حرّك الماوس حول الشاشة</div>
</div>

<script>
  const head = document.getElementById('head');
  const robot = document.getElementById('robot');
  const eyeL = document.getElementById('eyeL');
  const eyeR = document.getElementById('eyeR');
  const antL = document.getElementById('antL');
  const antR = document.getElementById('antR');

  let mouseX = window.innerWidth/2;
  let mouseY = window.innerHeight/2;

  window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });

  window.addEventListener('touchmove', (e) => {
    if(e.touches[0]){
      mouseX = e.touches[0].clientX;
      mouseY = e.touches[0].clientY;
    }
  });

  function animate(){
    const rect = robot.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height*0.35;

    const dx = mouseX - cx;
    const dy = mouseY - cy;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;

    // head tilt (subtle)
    const maxTilt = 10;
    const tiltX = Math.max(-maxTilt, Math.min(maxTilt, dy/40));
    const tiltY = Math.max(-maxTilt, Math.min(maxTilt, dx/40));
    head.style.transform = `rotateX(${-tiltX}deg) rotateY(${tiltY}deg)`;

    // eyes follow (small offset since it's an icon-eye)
    const eyeMax = 3;
    const ex = Math.max(-eyeMax, Math.min(eyeMax, dx/dist * eyeMax));
    const ey = Math.max(-eyeMax, Math.min(eyeMax, dy/dist * eyeMax));
    eyeL.style.transform = `translate(${ex}px, ${ey}px)`;
    eyeR.style.transform = `translate(${ex}px, ${ey}px)`;

    // antennae sway opposite to tilt
    antL.style.transform = `rotate(${tiltY*0.6}deg)`;
    antR.style.transform = `rotate(${tiltY*0.6}deg)`;

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
