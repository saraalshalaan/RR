<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Stand-up · Rimthan</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="map-page">

  <!-- ================= HEADER (shared) ================= -->
  <header class="header">
    <a href="index.html" class="brand">
      <span class="brand-mark"></span>
      <span class="brand-word">Rimthan</span>
    </a>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="#" class="active">Projects</a>
      <a href="#">Reports</a>
    </nav>
    <div class="header-right">
      <div class="search-pill">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="7" stroke-width="2"/><path d="M20 20L16.65 16.65" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="text" id="headerSearch" placeholder="Search ventures…" autocomplete="off" style="border:none;outline:none;background:transparent;font:inherit;color:var(--ink);width:130px;">
        <kbd>⌘K</kbd>
      </div>
      <div class="profile">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="8" r="3.6" stroke-width="1.8"/><path d="M4.5 19.2C5.8 15.9 8.6 14 12 14C15.4 14 18.2 15.9 19.5 19.2" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
    </div>
  </header>

  <main>
    <div class="breadcrumb">
      <a href="index.html">Venture Galaxy</a><span>/</span><span id="crumbName">Loading…</span>
    </div>

    <!-- header strip: Venture / Venture Lead / Stage / Overall Health -->
    <div class="venture-strip" id="ventureStrip"></div>

    <!-- everything below is filled in by project.js, or replaced with
         an empty state if this venture has no update generated yet -->
    <div id="updateBody"></div>
  </main>

  <script src="data.js"></script>
  <script src="project.js"></script>
</body>
</html>
