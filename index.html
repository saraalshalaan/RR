<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rimthan · Venture Galaxy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   RIMTHAN VENTURE GALAXY — DESIGN TOKENS
   ===================================================================== */
:root{
  /* --- palette --- */
  --void:        #05070D;   /* page background */
  --deep-navy:   #0B1220;   /* panel / card background */
  --panel-edge:  #16233D;   /* card borders / hairlines */
  --sapphire:    #2E5CE6;   /* primary route line, links */
  --cyan:        #4FE0E8;   /* glow accent, active state */
  --ink:         #E8EDF8;   /* primary text on dark */
  --slate:       #8B98B8;   /* secondary text */
  --slate-dim:   #58607A;   /* tertiary / captions */
  --on-track:    #3FE0A6;   /* health: good */
  --at-risk:     #F0A93B;   /* health: caution */
  --off-track:   #EF5D6C;   /* health: bad */

  /* --- type --- */
  --font-display: 'Space Grotesk', sans-serif;
  --font-body:    'Inter', sans-serif;
  --font-mono:    'IBM Plex Mono', monospace;

  /* --- shape --- */
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 8px;
}

*{margin:0;padding:0;box-sizing:border-box;}

html{scroll-behavior:smooth;}

body{
  font-family:var(--font-body);
  background:var(--void);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}

a{color:inherit;}

::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--panel-edge);border-radius:20px;}
::-webkit-scrollbar-track{background:transparent;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
}

/* =====================================================================
   HEADER — shared across both pages
   ===================================================================== */
.header{
  position:fixed;
  top:0; left:0; width:100%;
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 44px;
  background:rgba(5,7,13,0.72);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,0.06);
  z-index:999;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
}

.brand-mark{
  width:38px;height:38px;
  border-radius:10px;
  background:linear-gradient(145deg, var(--sapphire), #16306E);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset, 0 6px 18px rgba(46,92,230,0.35);
}
.brand-mark svg{width:22px;height:22px;display:block;}

.brand-word{
  font-family:var(--font-display);
  font-weight:600;
  font-size:19px;
  letter-spacing:0.5px;
  color:var(--ink);
}

.header nav{
  display:flex;
  gap:8px;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
}
.header nav a{
  text-decoration:none;
  color:var(--slate);
  font-size:14px;
  font-weight:500;
  letter-spacing:0.2px;
  padding:9px 16px;
  border-radius:999px;
  transition:color .25s ease, background .25s ease;
}
.header nav a:hover{color:var(--ink); background:rgba(255,255,255,0.05);}
.header nav a.active{color:var(--ink); background:rgba(79,224,232,0.1); box-shadow:0 0 0 1px rgba(79,224,232,0.25) inset;}

.header-right{display:flex;align-items:center;gap:16px;}
.profile{
  width:38px;height:38px;border-radius:50%;
  background:var(--deep-navy);
  border:1px solid var(--panel-edge);
  display:flex;align-items:center;justify-content:center;
  color:var(--slate);
  cursor:pointer;
  transition:.25s;
}
.profile:hover{color:var(--cyan);border-color:var(--cyan);}

/* =====================================================================
   PAGE 1 — VENTURE GALAXY MAP
   ===================================================================== */
.map-page main{
  padding-top:76px;
}

.map-hero{
  padding:56px 44px 8px;
  max-width:900px;
}
.map-hero .eyebrow{
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--cyan);
  display:flex;align-items:center;gap:10px;
}
.map-hero .eyebrow::before{
  content:"";
  width:16px;height:1px;background:var(--cyan);
}
.map-hero h1{
  font-family:var(--font-display);
  font-size:clamp(30px, 4vw, 46px);
  font-weight:600;
  margin:14px 0 10px;
  letter-spacing:-0.5px;
}
.map-hero p{
  color:var(--slate);
  font-size:16px;
  max-width:540px;
  line-height:1.55;
}

/* --- chart stage --- */
.chart-stage{
  position:relative;
  margin:28px 24px 60px;
  border-radius:28px;
  overflow:hidden;
  border:1px solid var(--panel-edge);
  background:
    radial-gradient(ellipse at 30% 20%, rgba(46,92,230,0.16), transparent 55%),
    radial-gradient(ellipse at 80% 75%, rgba(79,224,232,0.10), transparent 50%),
    var(--deep-navy);
}

.chart-stage svg.galaxy-svg{
  width:100%;
  height:auto;
  display:block;
}

.overlay-layer{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.contour{
  fill:none;
  stroke:rgba(79,224,232,0.10);
  stroke-width:1;
}
.contour.dim{stroke:rgba(46,92,230,0.07);}

.horizon-grid line{
  stroke:rgba(79,224,232,0.06);
  stroke-width:1;
}

.route-path{
  fill:none;
  stroke:url(#routeGradient);
  stroke-width:2.5;
  stroke-linecap:round;
  filter:drop-shadow(0 0 6px rgba(79,224,232,0.55));
  stroke-dasharray:6 10;
  animation:flow 26s linear infinite;
}
@keyframes flow{ to{ stroke-dashoffset:-500; } }

.star{fill:#ffffff;opacity:0.5;}

.node{cursor:pointer;}
.node-ring{
  fill:none;
  stroke-width:1.5;
  opacity:0.55;
  transform-origin:center;
  animation:pulse 3.2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{ transform:scale(1); opacity:0.45; }
  50%{ transform:scale(1.25); opacity:0.05; }
}
.node-core{ stroke-width:2; }
.node:hover .node-core, .node.active .node-core{ filter:drop-shadow(0 0 10px currentColor); }

.node-label{
  font-family:var(--font-display);
  font-size:15px;
  font-weight:600;
  fill:var(--ink);
}
.node-bearing{
  font-family:var(--font-mono);
  font-size:10.5px;
  fill:var(--slate-dim);
  letter-spacing:0.5px;
}

/* --- health colors, applied via inline data-health attr --- */
[data-health="On Track"]  { color:var(--on-track); }
[data-health="At Risk"]   { color:var(--at-risk); }
[data-health="Off Track"] { color:var(--off-track); }

/* --- holographic overlay card --- */
.overlay-card{
  position:absolute;
  width:250px;
  padding:20px 22px;
  border-radius:var(--radius-md);
  background:rgba(11,18,32,0.88);
  border:1px solid rgba(79,224,232,0.35);
  box-shadow:0 0 0 1px rgba(255,255,255,0.03) inset, 0 18px 40px rgba(0,0,0,0.5), 0 0 30px rgba(79,224,232,0.12);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  opacity:0;
  transform:translateY(6px) scale(0.96);
  pointer-events:none;
  transition:opacity .28s ease, transform .28s ease;
  z-index:50;
}
.overlay-card::before{
  content:"";
  position:absolute;
  left:-6px; top:24px;
  width:11px;height:11px;
  background:inherit;
  border-left:1px solid rgba(79,224,232,0.35);
  border-bottom:1px solid rgba(79,224,232,0.35);
  transform:rotate(45deg);
  border-radius:0 0 0 3px;
}
.overlay-card.flip-up::before{
  top:auto; bottom:14px;
  border-left:none; border-bottom:none;
  border-right:1px solid rgba(79,224,232,0.35);
  border-top:1px solid rgba(79,224,232,0.35);
}
.overlay-card.visible{
  opacity:1;
  transform:translateY(0) scale(1);
  pointer-events:auto;
}
.overlay-card .oc-title{
  font-family:var(--font-display);
  font-size:16px;
  font-weight:600;
  margin-bottom:2px;
}
.overlay-card .oc-tagline{
  font-size:12px;
  color:var(--slate);
  margin-bottom:14px;
}
.oc-health{
  display:flex;align-items:center;gap:8px;
  font-family:var(--font-mono);
  font-size:11.5px;
  letter-spacing:0.3px;
  margin-bottom:14px;
}
.oc-led{
  width:8px;height:8px;border-radius:50%;
  background:currentColor;
  box-shadow:0 0 8px currentColor;
}
.oc-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:16px;
}
.oc-stat{
  background:rgba(255,255,255,0.03);
  border-radius:var(--radius-sm);
  padding:9px 6px;
  text-align:center;
}
.oc-stat b{
  display:block;
  font-family:var(--font-mono);
  font-size:16px;
  color:var(--cyan);
}
.oc-stat span{
  font-size:9.5px;
  color:var(--slate-dim);
  text-transform:uppercase;
  letter-spacing:0.4px;
}
.oc-cta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  padding:9px 12px;
  border-radius:999px;
  border:1px solid rgba(79,224,232,0.3);
  background:rgba(79,224,232,0.06);
  color:var(--cyan);
  font-size:12.5px;
  font-weight:600;
  text-decoration:none;
  cursor:pointer;
  transition:.2s;
}
.oc-cta:hover{background:rgba(79,224,232,0.14);}
.oc-cta.disabled{
  color:var(--slate-dim);
  border-color:var(--panel-edge);
  background:transparent;
  cursor:default;
}
.oc-cta.disabled:hover{background:transparent;}

.map-legend{
  display:flex;
  gap:26px;
  padding:0 44px 50px;
  flex-wrap:wrap;
}
.legend-item{
  display:flex;align-items:center;gap:8px;
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--slate);
}
.legend-dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;}

/* =====================================================================
   PAGE 2 — TAKAMOL DETAIL
   ===================================================================== */
.detail-page main{
  padding:120px 44px 70px;
  max-width:1180px;
  margin:0 auto;
}

.breadcrumb{
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:0.5px;
  color:var(--slate-dim);
  display:flex;align-items:center;gap:8px;
  margin-bottom:18px;
}
.breadcrumb a{color:var(--slate);text-decoration:none;}
.breadcrumb a:hover{color:var(--cyan);}

.detail-hero{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:24px;
  flex-wrap:wrap;
  margin-bottom:36px;
}
.detail-hero h1{
  font-family:var(--font-display);
  font-size:clamp(28px,3.6vw,40px);
  font-weight:600;
  letter-spacing:-0.5px;
  margin-bottom:6px;
}
.detail-hero .week{
  font-family:var(--font-mono);
  font-size:13px;
  color:var(--slate);
}
.health-pill{
  display:flex;align-items:center;gap:9px;
  padding:10px 18px;
  border-radius:999px;
  background:var(--deep-navy);
  border:1px solid var(--panel-edge);
  font-family:var(--font-mono);
  font-size:13px;
  font-weight:500;
}

.card-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
  margin-bottom:22px;
}
.card{
  background:var(--deep-navy);
  border:1px solid var(--panel-edge);
  border-radius:var(--radius-lg);
  padding:26px 28px;
  position:relative;
  overflow:hidden;
}
.card::after{
  content:"";
  position:absolute; inset:0;
  background:radial-gradient(circle at 100% 0%, rgba(79,224,232,0.06), transparent 55%);
  pointer-events:none;
}
.card-full{grid-column:1 / -1;}

.card-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  margin-bottom:18px;
  gap:14px;
}
.card-head h3{
  font-family:var(--font-display);
  font-size:17px;
  font-weight:600;
  margin-bottom:3px;
}
.card-head small{
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--slate-dim);
  letter-spacing:0.4px;
  text-transform:uppercase;
}

/* circular meter */
.meter{
  position:relative;
  width:64px;height:64px;
  flex-shrink:0;
}
.meter svg{transform:rotate(-90deg);width:100%;height:100%;}
.meter circle{fill:none;stroke-width:6;}
.meter .track{stroke:rgba(255,255,255,0.06);}
.meter .value{stroke:var(--cyan);stroke-linecap:round;transition:stroke-dashoffset 1s ease;}
.meter-label{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);
  font-size:14px;
  font-weight:600;
}

.bullet-list{list-style:none;margin-bottom:18px;}
.bullet-list li{
  position:relative;
  padding-left:18px;
  font-size:14px;
  color:var(--slate);
  line-height:1.6;
  margin-bottom:8px;
}
.bullet-list li::before{
  content:"";
  position:absolute;left:0;top:8px;
  width:6px;height:6px;border-radius:50%;
  background:var(--cyan);
}

.next-step{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 16px;
  border-radius:999px;
  background:rgba(46,92,230,0.12);
  border:1px solid rgba(46,92,230,0.4);
  color:var(--ink);
  font-size:13px;
  font-weight:600;
  text-decoration:none;
}
.next-step::after{content:"→";}

.risk-card{
  border-left:3px solid var(--at-risk);
}
.risk-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.led{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;}
.risk-card p{color:var(--slate);font-size:14px;line-height:1.6;}
.severity-tag{
  font-family:var(--font-mono);
  font-size:11px;
  padding:3px 10px;
  border-radius:999px;
  background:rgba(240,169,59,0.12);
  color:var(--at-risk);
  border:1px solid rgba(240,169,59,0.3);
}

.support-card{
  border-left:3px solid var(--cyan);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
}
.support-card p{color:var(--slate);font-size:14px;line-height:1.6;max-width:60ch;}
.support-btn{
  padding:12px 20px;
  border-radius:999px;
  background:var(--cyan);
  color:#03222A;
  font-weight:700;
  font-size:13.5px;
  border:none;
  cursor:pointer;
  white-space:nowrap;
  transition:.2s;
}
.support-btn:hover{filter:brightness(1.08);transform:translateY(-1px);}

/* --- timeline card --- */
.timeline-wrap{position:relative;padding:34px 6px 6px;}
.timeline-track{
  position:relative;
  height:2px;
  background:linear-gradient(90deg, var(--on-track) 0%, var(--on-track) 48%, var(--panel-edge) 48%, var(--panel-edge) 100%);
  margin:0 30px;
}
.timeline-points{
  display:flex;
  justify-content:space-between;
  margin:0 30px;
  position:relative;
  top:-13px;
}
.tl-point{
  display:flex;
  flex-direction:column;
  align-items:center;
  width:120px;
  text-align:center;
}
.tl-dot{
  width:14px;height:14px;border-radius:50%;
  border:2px solid var(--on-track);
  background:var(--on-track);
  box-shadow:0 0 10px var(--on-track);
  margin-bottom:12px;
}
.tl-point.pending .tl-dot{
  background:var(--void);
  border-color:var(--slate-dim);
  box-shadow:none;
}
.tl-point span{font-size:12.5px;color:var(--slate);line-height:1.4;}
.tl-point.pending span{color:var(--slate-dim);}
.tl-tag{
  font-family:var(--font-mono);
  font-size:9.5px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  color:var(--slate-dim);
  margin-bottom:20px;
  display:block;
}

/* =====================================================================
   RESPONSIVE
   ===================================================================== */
@media (max-width:960px){
  .header nav{display:none;}
  .card-grid{grid-template-columns:1fr;}
  .timeline-track,.timeline-points{margin:0 10px;}
  .tl-point{width:auto;flex:1;}
}
@media (max-width:640px){
  .header{padding:0 20px;}
  .map-hero, .map-legend{padding-left:20px;padding-right:20px;}
  .chart-stage{margin:20px 10px 40px;}
  .detail-page main{padding:112px 18px 50px;}
  .support-card{flex-direction:column;align-items:flex-start;}
}

</style>
</head>
<body class="map-page">

  <!-- ================= HEADER (shared) ================= -->
  <header class="header">
    <a href="index.html" class="brand">
      <span class="brand-mark">
        <!-- Rimthan mark, redrawn as a clean vector color-block -->
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="24" r="11" stroke="white" stroke-width="5"/>
          <path d="M50 35 L20 82 Q50 100 80 82 Z" stroke="white" stroke-width="5" stroke-linejoin="round"/>
          <path d="M50 35 V95" stroke="white" stroke-width="5"/>
          <path d="M20 82 H80" stroke="white" stroke-width="5"/>
          <path d="M30 68 Q50 82 70 68" stroke="white" stroke-width="5"/>
        </svg>
      </span>
      <span class="brand-word">rimthan</span>
    </a>
    <nav>
      <a href="index.html" class="active">Dashboard</a>

      <a href="#">Reports</a>
    </nav>
    <div class="header-right">
      <div class="profile"><i>&#9679;</i></div>

  </header>

  <main>

    </section>

    <div class="chart-stage" id="chartStage">

  </main>

  <script>
/* =====================================================================
   RIMTHAN VENTURE GALAXY — DATA SOURCE
   ---------------------------------------------------------------------
   Everything the map and project pages render lives in this one file.
   Update these objects and the UI updates automatically — no markup
   or script changes required.
   ===================================================================== */

/* ----------------------------------------------------------------------
   1. VENTURE MAP DATA
   One entry per node on the Venture Galaxy chart (index.html).
   x / y are position coordinates on a 1200 x 640 chart plane —
   move a venture by changing these two numbers.
   ---------------------------------------------------------------------- */
const VENTURE_MAP = [
  {
    id: "takamol",
    name: "Takamol",
    tagline: "Workforce mobility platform",
    healthStatus: "On Track",       // "On Track" | "At Risk" | "Off Track"
    activePriorities: 6,
    risks: 1,
    milestonesCompleted: 14,
    iconImageUrl: "assets/icons/takamol.svg" // placeholder
  },
  {
    id: "aether",
    name: "Aether Mobility",
    tagline: "Autonomous last-mile fleet",
    healthStatus: "On Track",
    activePriorities: 4,
    risks: 0,
    milestonesCompleted: 9,
    iconImageUrl: "assets/icons/aether.svg"
  },
  {
    id: "novafreight",
    name: "Nova Freight",
    tagline: "Cross-border logistics network",
    healthStatus: "At Risk",
    activePriorities: 5,
    risks: 3,
    milestonesCompleted: 7,
    iconImageUrl: "assets/icons/novafreight.svg"
  },
  {
    id: "orbithealth",
    name: "Orbit Health",
    tagline: "Remote diagnostics network",
    healthStatus: "On Track",
    activePriorities: 3,
    risks: 1,
    milestonesCompleted: 11,
    iconImageUrl: "assets/icons/orbithealth.svg"
  },
  {
    id: "helios",
    name: "Helios Energy",
    tagline: "Distributed solar micro-grids",
    healthStatus: "Off Track",
    activePriorities: 2,
    risks: 4,
    milestonesCompleted: 3,
    iconImageUrl: "assets/icons/helios.svg"
  }
];

/* fixed chart coordinates, kept separate from business data on purpose —
   an AI-generated feed should never need to know where a dot sits on screen */
const VENTURE_POSITIONS = {
  takamol:     { x: 190,  y: 430, bearing: "N24° · E118°" },
  aether:      { x: 430,  y: 215, bearing: "N41° · E122°" },
  novafreight: { x: 655,  y: 465, bearing: "N08° · E131°" },
  orbithealth: { x: 885,  y: 195, bearing: "N53° · E140°" },
  helios:      { x: 1075, y: 405, bearing: "N02° · E152°" }
};

/* ----------------------------------------------------------------------

/* =====================================================================
   RIMTHAN VENTURE GALAXY — MAP RENDERER
   Reads venture data through loadVentureMap() / loadVenturePosition()
   (see data.js) and draws the chart + overlay cards. Those loaders are
   the only thing that will change when an AI backend is connected —
   nothing below this comment needs to.
   ===================================================================== */

const CHART_W = 1200;
const CHART_H = 640;

const HEALTH_COLOR = {
  "On Track":  "#3FE0A6",
  "At Risk":   "#F0A93B",
  "Off Track": "#EF5D6C"
};

const stage = document.getElementById("chartStage");
const overlayLayer = document.getElementById("overlayLayer");

/* ---- deterministic "stars" for atmosphere (fixed seed so layout is stable) ---- */
function seededStars(count){
  let seed = 42;
  const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  let out = "";
  for(let i=0;i<count;i++){
    const x = rand()*CHART_W;
    const y = rand()*CHART_H*0.6; // keep stars mostly in the upper sky
    const r = rand()*1.2 + 0.4;
    out += `<circle class="star" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" opacity="${(rand()*0.5+0.2).toFixed(2)}"/>`;
  }
  return out;
}

/* ---- horizon grid: perspective-style converging lines along the base ---- */
function horizonGrid(){
  let lines = "";
  for(let i=0;i<=10;i++){
    const y = 470 + i*17;
    const inset = i*46;
    lines += `<line x1="${inset}" y1="${y}" x2="${CHART_W-inset}" y2="${y}"/>`;
  }
  return `<g class="horizon-grid">${lines}</g>`;
}

/* ---- smooth path threading every node in map order ---- */
function routePath(nodes){
  const pts = nodes.slice().sort((a,b)=>a.pos.x-b.pos.x);
  let d = `M ${pts[0].pos.x} ${pts[0].pos.y}`;
  for(let i=1;i<pts.length;i++){
    const prev = pts[i-1].pos, cur = pts[i].pos;
    const midX = (prev.x + cur.x)/2;
    d += ` C ${midX} ${prev.y}, ${midX} ${cur.y}, ${cur.x} ${cur.y}`;
  }
  return d;
}

function buildSVG(ventures){
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", `0 0 ${CHART_W} ${CHART_H}`);
  svg.setAttribute("class", "galaxy-svg");
  svg.setAttribute("aria-label", "Venture Galaxy chart");

  svg.innerHTML = `
    <defs>
      <linearGradient id="routeGradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#2E5CE6"/>
        <stop offset="100%" stop-color="#4FE0E8"/>
      </linearGradient>
    </defs>

    <!-- topographic contour layers -->
    <path class="contour" d="M -40 120 Q 300 40 620 140 T 1260 90" />
    <path class="contour dim" d="M -40 200 Q 320 260 640 190 T 1260 230" />
    <path class="contour" d="M -40 520 Q 340 600 700 540 T 1260 560" />
    <path class="contour dim" d="M -40 60 Q 500 -20 900 60 T 1260 40" />

    ${horizonGrid()}
    ${seededStars(70)}

    <path class="route-path" d="${routePath(ventures)}" />

    <g id="nodesGroup"></g>
  `;

  const nodesGroup = svg.querySelector("#nodesGroup");
  ventures.forEach(v => {
    const color = HEALTH_COLOR[v.healthStatus] || "#8B98B8";
    const { x, y, bearing } = v.pos;
    const g = document.createElementNS(svgNS, "g");
    g.setAttribute("class", "node");
    g.setAttribute("data-id", v.id);
    g.setAttribute("tabindex", "0");
    g.setAttribute("role", "button");
    g.setAttribute("aria-label", `${v.name} — ${v.healthStatus}`);
    g.innerHTML = `
      <circle class="node-ring" cx="${x}" cy="${y}" r="14" stroke="${color}" style="animation-delay:${(x % 5) * 0.3}s"/>
      <circle class="node-core" cx="${x}" cy="${y}" r="7" fill="${color}" stroke="${color}"/>
      <text class="node-label" x="${x}" y="${y - 26}" text-anchor="middle">${v.name}</text>
      <text class="node-bearing" x="${x}" y="${y + 30}" text-anchor="middle">${bearing}</text>
    `;
    nodesGroup.appendChild(g);

    g.addEventListener("click", (e) => { e.stopPropagation(); toggleOverlay(v); });
    g.addEventListener("keydown", (e) => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggleOverlay(v); } });
  });

  return svg;
}

/* ---- overlay card: positioned in % so it tracks the responsive SVG ---- */
let activeId = null;

function toggleOverlay(v){
  document.querySelectorAll(".node").forEach(n => n.classList.toggle("active", n.dataset.id === v.id && activeId !== v.id));

  if(activeId === v.id){
    overlayLayer.innerHTML = "";
    activeId = null;
    return;
  }
  activeId = v.id;

  const { x, y } = v.pos;
  const leftPct = (x / CHART_W) * 100;
  const topPct  = (y / CHART_H) * 100;
  const color = HEALTH_COLOR[v.healthStatus] || "#8B98B8";

  const flipLeft = leftPct > 62; // keep the card on-screen near the right edge
  const cardLeft = flipLeft ? `calc(${leftPct}% - 268px)` : `calc(${leftPct}% + 24px)`;

  const flipUp = topPct > 55; // keep the card on-screen near the bottom edge
  const cardTop = flipUp ? `calc(${topPct}% - 260px)` : `calc(${topPct}% - 10px)`;

  // every node links to the same generic project page — it renders
  // whatever this venture's latest update looks like, including a
  // "not generated yet" state when there isn't one
  const cta = `<a class="oc-cta" href="project.html?venture=${v.id}">Open venture update <span>&rarr;</span></a>`;

  overlayLayer.innerHTML = `
    <div class="overlay-card visible ${flipUp ? "flip-up" : ""}" style="left:${cardLeft}; top:${cardTop}; color:${color};">
      <div class="oc-title" style="color:var(--ink)">${v.name}</div>
      <div class="oc-tagline">${v.tagline}</div>
      <div class="oc-health"><span class="oc-led"></span><span style="color:var(--ink)">${v.healthStatus}</span></div>
      <div class="oc-stats">
        <div class="oc-stat"><b>${v.activePriorities}</b><span>Priorities</span></div>
        <div class="oc-stat"><b>${v.risks}</b><span>Risks</span></div>
        <div class="oc-stat"><b>${v.milestonesCompleted}</b><span>Milestones</span></div>
      </div>
      ${cta}
    </div>
  `;
}

overlayLayer.addEventListener("click", (e) => e.stopPropagation());

document.addEventListener("click", () => {
  overlayLayer.innerHTML = "";
  activeId = null;
  document.querySelectorAll(".node").forEach(n => n.classList.remove("active"));
});

async function init(){
  const ventures = await loadVentureMap();
  // attach chart position/bearing to each venture (kept separate in data.js on purpose)
  for (const v of ventures) {
    v.pos = await loadVenturePosition(v.id);
  }
  stage.insertBefore(buildSVG(ventures), overlayLayer);
}

init();

  </script>
